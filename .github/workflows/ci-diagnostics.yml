name: CI diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI test diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run UI tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:ui > ui-test.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload UI test log
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-log
          path: ui-test.log
          retention-days: 2
      - name: Fail when tests failed
        if: ${{ steps.tests.outputs.exit_code != '0' }}
        run: exit 1

  document-flow:
    name: Document flow diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run document flow and capture output
        id: flow
        shell: bash
        run: |
          set +e
          npx playwright test tests/flows.spec.ts > document-flow.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload document flow log
        uses: actions/upload-artifact@v4
        with:
          name: document-flow-log
          path: document-flow.log
          retention-days: 2
      - name: Fail when document flow failed
        if: ${{ steps.flow.outputs.exit_code != '0' }}
        run: exit 1
